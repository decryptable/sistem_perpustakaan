name: Dart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Analyze project
        run: dart analyze

      - name: Run application
        run: dart run bin/main.dart

      - name: Compile executable on Unix
        if: runner.os != 'Windows'
        run: mkdir -p build && dart compile exe bin/main.dart -o build/sistem_perpustakaan

      - name: Compile executable on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir build
          dart compile exe bin/main.dart -o build/sistem_perpustakaan.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sistem_perpustakaan-${{ matrix.os }}
          path: build/
