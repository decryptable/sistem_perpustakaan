name: Dart CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Analyze project
        run: dart analyze

      - name: Run application
        run: dart run bin/main.dart

      - name: Compile executable on Unix
        if: runner.os != 'Windows'
        run: mkdir -p build && dart compile exe bin/main.dart -o build/sistem_perpustakaan

      - name: Compile executable on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir build
          dart compile exe bin/main.dart -o build/sistem_perpustakaan.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sistem_perpustakaan-${{ matrix.os }}
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/**/*
